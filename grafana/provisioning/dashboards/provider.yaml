# Tells Grafana to load any dashboard JSON found in /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: F1 dashboards
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    editable: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false